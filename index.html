<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - หน้าแรก</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fff0f5; color: #5c3a47; min-height: 100vh; position: relative; overflow-x: hidden; }
        .bg-glow-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden; pointer-events: none; }
        .glow-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; }
        .blob-1 { width: 400px; height: 400px; background: #ffb6c1; top: -100px; left: -100px; }
        .container { max-width: 800px; margin: 25px auto; padding: 0 15px; }
        .card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border-radius: 24px; padding: 30px 20px; box-shadow: 0 10px 35px rgba(235, 130, 160, 0.25); border: 2px solid rgba(255, 255, 255, 0.95); text-align: center; }
        .profile-img-wrapper { position: relative; display: inline-block; margin-bottom: 20px; }
        .profile-img { width: 180px; height: 180px; object-fit: cover; border-radius: 50%; border: 5px solid #ffffff; box-shadow: 0 8px 25px rgba(255, 105, 180, 0.35); }
        .info-box { background: linear-gradient(135deg, rgba(255, 240, 245, 0.95), rgba(255, 228, 233, 0.95)); border-radius: 16px; padding: 20px; text-align: left; margin-top: 20px; border: 1px solid #ffd1dc; }
        .info-box h3 { color: #d81b60; margin-bottom: 10px; font-size: 18px; }
        .info-box p { margin: 8px 0; color: #6b3e52; font-size: 15px; line-height: 1.8; }
        .contact-box { background: #ffffff; border-radius: 16px; padding: 20px; text-align: left; margin-top: 20px; border: 1px dashed #ffb6c1; }
        .contact-box h3 { color: #c2185b; margin-bottom: 12px; font-size: 18px; }
        .contact-list { list-style: none; }
        .contact-list li { margin: 10px 0; font-size: 15px; }
        .contact-list a { color: #e91e63; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="bg-glow-container"><div class="glow-blob blob-1"></div></div>
    <div class="container">
        <div class="card">
            <div class="profile-img-wrapper">
                <img src="S27320348.jpg" alt="รูปโปรไฟล์ อรณิฎาศ์" class="profile-img">
            </div>
            <div class="info-box">
                <h3>🌸 แนะนำตัว</h3>
                <p><strong>ชื่อ-นามสกุล:</strong> นางสาวอรณิฎาศ์ จันทร์เทวาลิขิต (ซีน)</p>
                <p><strong>แผนการเรียน:</strong> Gifted (ห้องเรียนพิเศษวิทยาศาสตร์-คณิตศาสตร์)</p>
            </div>
            <div class="contact-box">
                <h3>💌 ช่องทางการติดต่อ</h3>
                <ul class="contact-list">
                    <li>📷 <strong>Instagram:</strong> <a href="https://instagram.com/sezxnq" target="_blank">sezxnq</a></li>
                    <li>👤 <strong>Facebook:</strong> <a href="https://facebook.com/onnida chanthewalikhit" target="_blank">onnida chanthewalikhit</a></li>
                    <li>✉️ <strong>Gmail:</strong> <a href="mailto:s34884@banbung.ac.th">s34884@banbung.ac.th</a></li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
