        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f9f4; color: #3b533f; min-height: 100vh; position: relative; overflow-x: hidden; }
        .bg-glow-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden; pointer-events: none; }
        .glow-blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; }
        .blob-1 { width: 450px; height: 450px; background: #c8e6c9; top: -100px; left: -100px; }
        .blob-2 { width: 400px; height: 400px; background: #dcedc8; bottom: -100px; right: -100px; }
        .nav-bar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 12px 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 4px 15px rgba(56, 142, 60, 0.1); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #c8e6c9; }
        .nav-bar a { text-decoration: none; color: #2e7d32; padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; transition: all 0.3s; background: #e8f5e9; }
        .nav-bar a:hover, .nav-bar a.active { background: #2e7d32; color: #ffffff; }
        .container { max-width: 800px; margin: 25px auto; padding: 0 15px; }
        .card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border-radius: 24px; padding: 30px 20px; box-shadow: 0 10px 35px rgba(76, 175, 80, 0.15); border: 2px solid rgba(255, 255, 255, 0.95); text-align: center; }
        .profile-img-wrapper { position: relative; display: inline-block; margin-bottom: 20px; }
        .profile-img { width: 180px; height: 180px; object-fit: cover; border-radius: 50%; border: 5px solid #ffffff; box-shadow: 0 8px 25px rgba(76, 175, 80, 0.25); }
        .info-box { background: linear-gradient(135deg, rgba(232, 245, 233, 0.95), rgba(200, 230, 201, 0.95)); border-radius: 16px; padding: 20px; text-align: left; margin-top: 20px; border: 1px solid #a5d6a7; }
        .info-box h3 { color: #2e7d32; margin-bottom: 10px; font-size: 18px; }
        .info-box p { margin: 8px 0; color: #274e13; font-size: 15px; line-height: 1.8; }
        .contact-box { background: #ffffff; border-radius: 16px; padding: 20px; text-align: left; margin-top: 20px; border: 1px dashed #a5d6a7; }
        .contact-box h3 { color: #1b5e20; margin-bottom: 12px; font-size: 18px; }
        .contact-list { list-style: none; }
        .contact-list li { margin: 10px 0; font-size: 15px; }
        .contact-list a { color: #2e7d32; text-decoration: none; font-weight: 600; }
