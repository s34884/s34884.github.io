<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - พิมพ์ลภัส อรุโณ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b132b;
            color: #e0e6ed;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* --- พื้นหลัง Deep Blue แสงเรืองวงกลม --- */
        .bg-glow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -3;
            overflow: hidden;
            pointer-events: none;
        }

        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            animation: floatGlow 14s infinite ease-in-out alternate;
        }

        .blob-1 {
            width: 450px;
            height: 450px;
            background: #1c2541;
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 550px;
            height: 550px;
            background: #3a506b;
            bottom: -150px;
            right: -100px;
            animation-duration: 18s;
        }

        .blob-3 {
            width: 350px;
            height: 350px;
            background: #48cae4;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.25;
            animation-duration: 20s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 50px) scale(1.1); }
            100% { transform: translate(-30px, 30px) scale(0.95); }
        }

        /* --- เอฟเฟกต์ Comet (ดาวตก) --- */
        .comet-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
        }

        .comet {
            position: absolute;
            height: 2px;
            background: linear-gradient(-45deg, rgba(255, 255, 255, 1), rgba(72, 202, 228, 0.8), transparent);
            border-radius: 999px;
            filter: drop-shadow(0 0 6px rgba(72, 202, 228, 0.8));
            opacity: 0;
            animation: meteor 4s linear infinite;
        }

        .comet::before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px #ffffff, 0 0 20px #48cae4;
        }

        @keyframes meteor {
            0% { opacity: 0; transform: rotate(-45deg) translateX(0); }
            10% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; transform: rotate(-45deg) translateX(-1200px); }
        }

        .c1 { top: -50px; right: 0%; width: 120px; animation-duration: 3.5s; animation-delay: 0s; }
        .c2 { top: 10%; right: -5%; width: 160px; animation-duration: 4.8s; animation-delay: 1.2s; }
        .c3 { top: -80px; right: 25%; width: 90px; animation-duration: 3s; animation-delay: 2.5s; }
        .c4 { top: 20%; right: -10%; width: 140px; animation-duration: 5.2s; animation-delay: 0.7s; }
        .c5 { top: -30px; right: 15%; width: 110px; animation-duration: 4.1s; animation-delay: 3.8s; }

        /* --- ปุ่มเมนู 3 ขีด --- */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 25px;
            z-index: 100001;
            width: 50px;
            height: 50px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid #00b4d8;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-btn span {
            width: 24px;
            height: 3px;
            background-color: #00b4d8;
            border-radius: 3px;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .menu-btn.open span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }
        .menu-btn.open span:nth-child(2) {
            opacity: 0;
        }
        .menu-btn.open span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* แถบเมนูด้านข้าง */
        .nav-overlay {
            position: fixed;
            top: 0;
            right: -100%;
            width: 290px;
            height: 100vh;
            background: rgba(11, 19, 43, 0.98);
            backdrop-filter: blur(25px);
            z-index: 100000;
            padding: 90px 20px 30px 20px;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.8);
            border-left: 1px solid rgba(72, 202, 228, 0.3);
            transition: right 0.35s ease-in-out;
        }

        .nav-overlay.open {
            right: 0 !important;
        }

        .nav-overlay ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-overlay button {
            width: 100%;
            text-align: left;
            background: rgba(255, 255, 255, 0.05);
            color: #caf0f8;
            font-weight: 600;
            border: 1px solid rgba(72, 202, 228, 0.2);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: block;
        }

        .nav-overlay button:hover, .nav-overlay button.active {
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #ffffff;
            border-color: #48cae4;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
        }

        /* Container หลัก */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 
                        inset 0 0 15px rgba(72, 202, 228, 0.1);
            border: 1px solid rgba(72, 202, 228, 0.25);
            margin-bottom: 25px;
            text-align: center;
            position: relative;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .tab-content.active {
            display: block !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- กรอบรูปโปรไฟล์วงกลมทรงสมดุล --- */
        .profile-img-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #00b4d8;
            box-shadow: 0 0 25px rgba(0, 180, 216, 0.5);
            background-color: #1c2541;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 25%;
            display: block;
        }

        .info-box {
            background: rgba(28, 37, 65, 0.7);
            border-radius: 16px;
            padding: 22px;
            text-align: left;
            margin-top: 20px;
            border: 1px solid rgba(72, 202, 228, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .info-box h3 {
            color: #48cae4;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .info-box p {
            margin: 8px 0;
            color: #d1d5db;
            font-size: 15px;
            line-height: 1.8;
        }

        .info-box ul {
            margin-left: 20px;
            color: #d1d5db;
            line-height: 1.8;
        }

        /* สไตล์สำหรับตัวหนังสือขนาดเล็กย่อยลงมา */
        .sub-text {
            font-size: 13px;
            color: #94a3b8;
            margin-top: -4px;
            margin-bottom: 10px;
            padding-left: 15px;
        }

        .cert-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(72, 202, 228, 0.3);
            margin-top: 15px;
            text-align: center;
        }
